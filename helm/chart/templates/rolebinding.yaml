apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-{{ required "team must be set" .Values.team }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-{{ required "team must be set" .Values.team }}
subjects:
- kind: ServiceAccount
  name: jenkins-{{ required "team must be set" .Values.team }}